# Gate changes to the detection + anti-cheat rules (docs/13_CI_CD.md).
#
# The raw file on `main` IS the distribution endpoint (docs/05_DETECTION.md),
# so there is nothing to publish — this workflow only gates correctness. That
# also means a bad merge ships to every user on their next rules check, which
# is why the anticheat block gets extra scrutiny here.

name: Rules

# The path filter must cover everything the gate DEPENDS on, not just the data.
# Filtering on the data file alone left three ways to weaken the blocklist
# without ever running this job: edit the schema (its `contains` blocks are what
# make Vanguard-in-drivers mandatory), edit the validator, or edit this file.
#
# Written out twice rather than with a YAML anchor: the Actions workflow parser
# does not expand anchors, so `paths: *alias` would silently become no filter.
on:
  push:
    branches: [main]
    paths:
      - 'rules/detection-rules.json'
      - 'rules/detection-rules.schema.json'
      - 'tools/rules-validate.ps1'
      - '.github/workflows/rules-publish.yml'
  pull_request:
    paths:
      - 'rules/detection-rules.json'
      - 'rules/detection-rules.schema.json'
      - 'tools/rules-validate.ps1'
      - '.github/workflows/rules-publish.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the removal check needs the base commit, not a shallow tip

      - name: Validate schema and anticheat block
        shell: pwsh
        run: ./tools/rules-validate.ps1

      # Removing a blocklist entry is a safety change and requires the same
      # review as a security fix — so it FAILS the job. It previously emitted
      # ::warning:: and exited 0, which meant a PR deleting BattlEye went green
      # and shipped to every user on their next rules check. A warning nobody is
      # forced to read is the same fail-open shape as a check that succeeds
      # while telling you nothing (docs/spike-notes.md §Guard).
      - name: Fail on anticheat removals
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseRef = "origin/${{ github.base_ref }}"
          $base = git show "${baseRef}:rules/detection-rules.json" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $base) {
            # Fail closed. "Could not compare" must never read as "nothing was
            # removed" — that is the branch this job exists to cover.
            Write-Host "::error::Cannot read rules/detection-rules.json at $baseRef, so removals cannot be detected. Refusing rather than reporting success."
            exit 1
          }
          $old = ($base | ConvertFrom-Json).anticheat
          $new = (Get-Content rules/detection-rules.json -Raw | ConvertFrom-Json).anticheat

          # Every family-bearing group, not just modules+drivers. Gutting
          # services, directories or files removes real signals that
          # 19_SAFETY pre-injection checks 2 and 4 depend on.
          $groups = 'modules', 'drivers', 'directories', 'services', 'files'

          # VALUES, not just family names. Comparing names alone let the whole
          # blocklist be gutted one token at a time: shrinking Easy Anti-Cheat /
          # modules from ["EasyAntiCheat","EasyAntiCheat_EOS"] to one entry keeps
          # the family present and passed this job. It also shrinks the §S21
          # compiled-in floor, which is GENERATED from this file — so the check
          # that is supposed to make the blocklist un-removable was blind to the
          # removals that matter most.
          function Get-Tokens($ac) {
            $out = @()
            foreach ($g in $groups) {
              if ($null -ne $ac.PSObject.Properties[$g]) {
                foreach ($f in @($ac.$g)) {
                  # The family itself, so an entirely deleted family still shows
                  # up even if it had no values.
                  $out += "$g/$($f.family)"
                  foreach ($v in @($f.values)) { $out += "$g/$($f.family)/$v" }
                }
              }
            }

            # THE HEURISTIC BLOCK IS NOT ONE OF THE FIVE GROUPS, and leaving it
            # out was a hole the same size as the one this job was just repaired
            # to close. `nameFragments` can be cut from five entries to one with
            # every gate in the repository green — the schema only enforces
            # minItems: 1 — and because tools/gen-ac-floor.ps1 generates
            # kFloorFragments from this very array, the §S21 compiled-in floor
            # shrinks with it. The floor exists so data can ADD and cannot
            # remove; a removal channel that bypasses it defeats the whole
            # mechanism.
            #
            # trustedSigners is DELIBERATELY NOT HERE, and the reason is polarity.
            #
            # This function feeds a REMOVAL check ($removed = old - new). For the
            # five groups and for nameFragments that is the right direction:
            # removing an entry weakens the gate. trustedSigners is the one
            # ALLOW-widening list, so its hazard runs the other way — an ADDITION
            # suppresses refusals, while a REMOVAL makes the guard stricter.
            #
            # Feeding it to the removal check therefore gated the safe direction
            # and left the dangerous one wide open, under a comment that claimed
            # the opposite in as many words ("rules-publish cannot see such an
            # addition. It can now."). A token that appears only in $new is never
            # in old-minus-new. It is checked below against $new - $old, which is
            # the direction that can hurt.
            if ($null -ne $ac.PSObject.Properties['heuristic']) {
              foreach ($v in @($ac.heuristic.nameFragments)) { $out += "heuristic/nameFragments/$v" }
            }
            return $out
          }
          $removed = @(Get-Tokens $old | Where-Object { $_ -notin (Get-Tokens $new) })

          # The opposite polarity, and it needs its own comparison rather than a
          # place in Get-Tokens. trustedSigners feeds IsTrustedSigner
          # (fl_ac_rules.h), which SUPPRESSES the fuzzy tier's refusals; it is
          # deliberately excluded from the §S21 compiled-in floor because
          # flooring an allowlist has the wrong polarity; and 19_SAFETY forbids
          # letting a rules push widen the hard gate's blind spot. So here the
          # reviewable event is an ADDITION.
          function Get-Signers($ac) {
            if ($null -eq $ac.PSObject.Properties['heuristic']) { return @() }
            return @(@($ac.heuristic.trustedSigners) | Where-Object { $null -ne $_ })
          }
          $widened = @(Get-Signers $new | Where-Object { $_ -notin (Get-Signers $old) })

          # Per-title lists carry no family, so compare them by count.
          $shrunk = @()
          foreach ($k in 'blockedExecutables', 'blockedStoreIds') {
            $o = @($old.$k).Count; $n = @($new.$k).Count
            if ($n -lt $o) { $shrunk += "$k ($o -> $n)" }
          }

          if ($removed.Count -gt 0 -or $shrunk.Count -gt 0 -or $widened.Count -gt 0) {
            if ($removed.Count -gt 0) { Write-Host "::error::Anti-cheat blocklist entries removed: $($removed -join ', ')" }
            if ($shrunk.Count -gt 0) { Write-Host "::error::Anti-cheat block shrank: $($shrunk -join ', ')" }
            if ($widened.Count -gt 0) { Write-Host "::error::Trusted signers ADDED: $($widened -join ', '). heuristic.trustedSigners suppresses the unknown-but-suspicious tier's refusals, so an addition widens the hard gate's blind spot. Reviewed like a removal." }
            Write-Host 'This is a SAFETY change. It is gated deliberately: weakening the blocklist — by removing an entry, shrinking a per-title list, or adding a trusted signer — is reviewed like a security fix (docs/19_SAFETY_AND_ANTICHEAT.md), in public, not waved through with a warning.'
            exit 1
          }
          Write-Host 'No anti-cheat families removed, no per-title list shrank, and no trusted signer added.'
