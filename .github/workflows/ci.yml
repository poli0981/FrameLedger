# FrameLedger CI (docs/13_CI_CD.md).
#
# Repo-local rather than a caller stub, by necessity: the poli0981/.github
# reusable `desktop-csharp` template runs dotnet restore/build/test directly and
# exposes no input for a native pre-step, MSVC setup, or the Vulkan SDK.
# FrameLedger's build is mixed-toolchain and native-first, and docs/12_BUILD.md
# commits to CI running *the identical script* as local — a promise a
# pure-managed template cannot keep.
#
# So this workflow does exactly one thing of substance: ./build.ps1 check.
# Anything CI checks that local does not is a way for the two to disagree.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permissions do not inherit into reusable workflows, and defaults are broader
# than this job needs either way (docs/13_CI_CD.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Version comes from global.json. Pinning it twice is a way for the
          # two pins to drift.
          global-json-file: global.json

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # PIN clang-format. Its output is version-dependent (alignment especially),
      # so an unpinned binary means the formatting gate can pass locally and
      # fail here for a reason the failure message does not mention — which is
      # exactly what happened, and cost a CI round trip to diagnose.
      #
      # 12_BUILD promises CI runs the identical script. The script was identical;
      # the tool was not. The runner image ships its own clang-format on PATH,
      # and build.ps1 only falls back to the VS-bundled one when nothing is
      # there — so this must come first and must be the version developers get
      # from the pinned VS C++ workload. build.ps1 prints the version it used.
      - name: Pin clang-format
        shell: pwsh
        run: |
          pip install --disable-pip-version-check "clang-format==21.1.7"
          clang-format --version

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # No Vulkan SDK step, and there will not be one. The Khronos headers are
      # vendored at src/native/third_party/vulkan-headers (Apache-2.0 OR MIT),
      # so FrameLedger.VkLayer compiles here with nothing extra installed. That
      # was the reason for vendoring rather than fetching: the alternative was a
      # ~1 GB SDK download on every run. See that directory's README.md.
      #
      # The SDK is still needed to RUN tools/vklayer-blastradius.ps1, which
      # registers the layer and inspects loader behaviour. That is deliberately
      # not part of `build.ps1 check`: it mutates HKCU, and a CI runner is the
      # wrong place to be registering machine-wide Vulkan layers.

      - name: Quality gate
        shell: pwsh
        run: ./build.ps1 check
        env:
          CI: 'true'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn
          retention-days: 14
